[package]
name = "exmt-core"
version = "0.1.0"
edition = "2021"
description = "Self-hosted Unity asset pipeline for EXMT Modbox (no third-party crates)"
license = "MIT"

[lib]
name = "exmt_core"
path = "src/lib.rs"

# Intentionally empty: the asset core uses only the standard library. Tauri's
# own dependencies live in src-tauri and are not part of this crate.
[dependencies]

# The test suite parses real bundles; opt-level 0 makes the LZ4 and type-tree
# work several times slower. This is a separate workspace from src-tauri, so
# the setting has to be repeated here.
[profile.dev]
opt-level = 1
