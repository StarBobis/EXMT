[package]
name = "exmt-modbox"
version = "0.1.0"
description = "EXMT Modbox — a Tauri-based mod toolbox"
authors = ["EXMT"]
edition = "2024"

[lib]
# The `_lib` suffix avoids a name clash between the lib and the bin on Windows.
name = "exmt_modbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The self-hosted asset pipeline. Path dependency on purpose: the core is part
# of this repo and ships with the app.
exmt-core = { path = "../core-rs" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
